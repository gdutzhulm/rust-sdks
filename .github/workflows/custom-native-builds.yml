# 定制原生库构建（Windows=D3D11 共享纹理 / macOS=IOSurface）
#
# 只做一件事：在 CI 上把**我们定制过的** livekit_ffi 编出来，供 MeettingCaptrue 的 SDK 使用。
#   · windows-latest → livekit_ffi.dll（D3D11 sink + 本端帧率上限 + 丢弃计数 + box 降采样）
#   · macos-latest   → liblivekit_ffi.dylib（IOSurface sink，同样的限速/计数语义）
#
# 预编译 WebRTC 显式下载（不依赖 webrtc-sys 内置下载：实测它在 CI 上会在 resp.copy_to(...) 处失败，
# "Failed to write WebRTC download to temporary file: error decoding response body"）：
#   https://github.com/livekit/rust-sdks/releases/download/webrtc-51ef663/webrtc-<triple>.zip
#
# 失败时会把 build.log 的尾巴写成 commit 评论（"Report failure" 步骤），方便直接定位。
#
# 产物在本次 run 的 Artifacts 里：
#   livekit_ffi.dll      → LiveKit.Client.Sdk/runtimes/win-x64/native/
#   liblivekit_ffi.dylib → LiveKit.Client.Sdk/runtimes/{osx-arm64|osx-x64}/native/

name: Custom native builds (D3D11 + IOSurface)

on:
  push:
    branches: [custom/d3d11-video-sink]
    paths:
      - 'webrtc-sys/**'
      - 'libwebrtc/**'
      - 'livekit-ffi/**'
      - '.github/workflows/custom-native-builds.yml'
  workflow_dispatch:

permissions:
  contents: write   # 只为失败时写 commit 评论

env:
  CARGO_TERM_COLOR: always
  WEBRTC_TAG: webrtc-51ef663
jobs:

  windows-x64:
    name: Windows x64 (D3D11 sink)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          cache: true
          rustflags: ""
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prebuilt WebRTC (Windows)
        shell: pwsh
        env:
          WEBRTC_BASE: https://github.com/livekit/rust-sdks/releases/download/${{ env.WEBRTC_TAG }}
        run: |
          $triple = 'win-x64-release'
          curl.exe -sSL --retry 5 --retry-all-errors -o webrtc.zip "$env:WEBRTC_BASE/webrtc-$triple.zip"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::下载 WebRTC 失败"; exit 1 }
          New-Item -ItemType Directory -Force webrtc | Out-Null
          tar -xf webrtc.zip -C webrtc
          $ninja = Get-ChildItem -Path webrtc -Recurse -Filter webrtc.ninja | Select-Object -First 1
          if (-not $ninja) { Write-Host "::error::解压后找不到 webrtc.ninja"; exit 1 }
          "LK_CUSTOM_WEBRTC=$($ninja.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "LK_CUSTOM_WEBRTC=$($ninja.DirectoryName)"
          Get-ChildItem $ninja.DirectoryName | Select-Object Name, Length

      - name: Build livekit-ffi (release)
        shell: bash
        run: |
          set -o pipefail
          cargo build -p livekit-ffi --release --target x86_64-pc-windows-msvc 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "::error::cargo build 失败（exit $rc）"; fi
          exit $rc

      - name: Smoke test webrtc-sys
        continue-on-error: true
        shell: bash
        run: cargo test -p webrtc-sys --release --target x86_64-pc-windows-msvc -- --nocapture --test-threads=1 2>&1 | tail -n 60

      - name: Check artifact
        shell: pwsh
        run: |
          $p = 'target/x86_64-pc-windows-msvc/release/livekit_ffi.dll'
          if (-not (Test-Path $p)) { Write-Host "::error::缺少产物 $p"; exit 1 }
          Get-Item $p | Select-Object FullName, Length, LastWriteTime

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livekit_ffi-windows-x64
          path: target/x86_64-pc-windows-msvc/release/livekit_ffi.dll
          if-no-files-found: warn

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
          JOB_NAME: Windows x64 (D3D11 sink)
        run: |
          {
            echo "### $JOB_NAME 失败"
            echo
            echo "- LK_CUSTOM_WEBRTC=${LK_CUSTOM_WEBRTC}"
            ls -l webrtc.zip 2>/dev/null || echo "(没有 webrtc.zip)"
            echo
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "(没有 build.log)"
            echo '```'
          } > report.md
          cat report.md
          # gh 的 -F key=@file 才会把文件内容原样发送；这里刻意不写行尾续行符
          # （YAML 块标量里的反斜杠会被当字面字符，GitHub 上实测会让这一步犯错）。
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@report.md >/dev/null 2>&1; then
            echo "已把日志尾巴发到 commit 评论"
          else
            echo "（提交评论失败，忽略）"
          fi
          true


  macos-arm64:
    name: macOS arm64 (IOSurface sink)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache: true
          rustflags: ""
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prebuilt WebRTC
        run: |
          set -e
          triple=mac-arm64-release
          curl -sSL --retry 5 --retry-all-errors -o webrtc.zip \
            "https://github.com/livekit/rust-sdks/releases/download/$WEBRTC_TAG/webrtc-$triple.zip"
          mkdir -p webrtc && tar -xf webrtc.zip -C webrtc
          ninja=$(find webrtc -name webrtc.ninja | head -n1 || true)
          if [ -z "$ninja" ]; then echo "::error::解压后找不到 webrtc.ninja"; ls -R webrtc | head -50; exit 1; fi
          root=$(dirname "$ninja")
          echo "LK_CUSTOM_WEBRTC=$PWD/$root" >> $GITHUB_ENV
          echo "LK_CUSTOM_WEBRTC=$PWD/$root"
          ls -l "$root"

      - name: Build livekit-ffi (release)
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -o pipefail
          cargo build -p livekit-ffi --release --target aarch64-apple-darwin 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "::error::cargo build 失败（exit $rc）"; fi
          exit $rc

      - name: Smoke test webrtc-sys
        continue-on-error: true
        run: cargo test -p webrtc-sys --release --target aarch64-apple-darwin -- --nocapture --test-threads=1 2>&1 | tail -n 60

      - name: Check artifact
        run: |
          f=target/aarch64-apple-darwin/release/liblivekit_ffi.dylib
          test -f "$f" || { echo "::error::缺少产物 $f"; exit 1; }
          ls -l "$f"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liblivekit_ffi-macos-arm64
          path: target/aarch64-apple-darwin/release/liblivekit_ffi.dylib
          if-no-files-found: warn

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
          JOB_NAME: macOS arm64 (IOSurface sink)
        run: |
          {
            echo "### $JOB_NAME 失败"
            echo
            echo "- LK_CUSTOM_WEBRTC=${LK_CUSTOM_WEBRTC}"
            ls -l webrtc.zip 2>/dev/null || echo "(没有 webrtc.zip)"
            echo
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "(没有 build.log)"
            echo '```'
          } > report.md
          cat report.md
          # gh 的 -F key=@file 才会把文件内容原样发送；这里刻意不写行尾续行符
          # （YAML 块标量里的反斜杠会被当字面字符，GitHub 上实测会让这一步犯错）。
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@report.md >/dev/null 2>&1; then
            echo "已把日志尾巴发到 commit 评论"
          else
            echo "（提交评论失败，忽略）"
          fi
          true


  macos-x64:
    name: macOS x64 (IOSurface sink, 交叉编译)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-apple-darwin
          cache: true
          rustflags: ""
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prebuilt WebRTC
        run: |
          set -e
          triple=mac-x64-release
          curl -sSL --retry 5 --retry-all-errors -o webrtc.zip \
            "https://github.com/livekit/rust-sdks/releases/download/$WEBRTC_TAG/webrtc-$triple.zip"
          mkdir -p webrtc && tar -xf webrtc.zip -C webrtc
          ninja=$(find webrtc -name webrtc.ninja | head -n1 || true)
          if [ -z "$ninja" ]; then echo "::error::解压后找不到 webrtc.ninja"; ls -R webrtc | head -50; exit 1; fi
          root=$(dirname "$ninja")
          echo "LK_CUSTOM_WEBRTC=$PWD/$root" >> $GITHUB_ENV
          echo "LK_CUSTOM_WEBRTC=$PWD/$root"
          ls -l "$root"

      - name: Build livekit-ffi (release)
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          set -o pipefail
          cargo build -p livekit-ffi --release --target x86_64-apple-darwin 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "::error::cargo build 失败（exit $rc）"; fi
          exit $rc

      - name: Smoke test webrtc-sys
        continue-on-error: true
        run: cargo test -p webrtc-sys --release --target x86_64-apple-darwin -- --nocapture --test-threads=1 2>&1 | tail -n 60

      - name: Check artifact
        run: |
          f=target/x86_64-apple-darwin/release/liblivekit_ffi.dylib
          test -f "$f" || { echo "::error::缺少产物 $f"; exit 1; }
          ls -l "$f"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liblivekit_ffi-macos-x64
          path: target/x86_64-apple-darwin/release/liblivekit_ffi.dylib
          if-no-files-found: warn

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
          JOB_NAME: macOS x64 (IOSurface sink, 交叉编译)
        run: |
          {
            echo "### $JOB_NAME 失败"
            echo
            echo "- LK_CUSTOM_WEBRTC=${LK_CUSTOM_WEBRTC}"
            ls -l webrtc.zip 2>/dev/null || echo "(没有 webrtc.zip)"
            echo
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "(没有 build.log)"
            echo '```'
          } > report.md
          cat report.md
          # gh 的 -F key=@file 才会把文件内容原样发送；这里刻意不写行尾续行符
          # （YAML 块标量里的反斜杠会被当字面字符，GitHub 上实测会让这一步犯错）。
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@report.md >/dev/null 2>&1; then
            echo "已把日志尾巴发到 commit 评论"
          else
            echo "（提交评论失败，忽略）"
          fi
          true

